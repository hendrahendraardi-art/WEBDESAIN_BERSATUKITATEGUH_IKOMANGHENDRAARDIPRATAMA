<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Elite Community — RiverWatch</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary: #00ff88;
            --accent: #00d4ff;
            --dark-bg: #000000;
            --glass-bg: rgba(10, 15, 20, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            font-family: var(--font-main);
            color: #ffffff;
            overflow: hidden; 
            height: 100vh;
        }

        #earth-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(circle at center, transparent 10%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center; 
            height: 100vh;
            padding: 24px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 36px; 
            width: 100%;
            max-width: 380px; 
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(255, 255, 255, 0.02);
            animation: fadeInCenter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center; 
        }

        @keyframes fadeInCenter {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .brand-pill {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.9);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .input-box {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-box label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 16px;
            transition: 0.3s;
        }

        .input-box input, .input-box select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 13px 14px 13px 44px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box select {
            appearance: none;
            -webkit-appearance: none;
        }

        .input-box input:focus, .input-box select:focus {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.03);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }

        .input-box input:focus + i, .input-box select:focus + i {
            color: var(--primary);
        }

        .btn-join {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--primary), #00b35f);
            border: none;
            border-radius: 14px;
            color: #020806;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 255, 136, 0.25);
        }

        footer {
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 3px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="earth-canvas"></div>
    <div class="vignette"></div>

    <div class="main-container">
        <main class="glass-card">
            <div class="brand-pill">Global Network</div>
            <h1>Join Community <br><span class="text-gradient">RiverWatch</span></h1>
            <p class="subtitle">Satu bumi. Satu pergerakan. Mulai langkahmu di sini.</p>

            <form onsubmit="event.preventDefault()">
                <div class="input-box">
                    <label>Nama Lengkap</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person"></i>
                        <input type="text" placeholder="Nama asli Anda..." required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Alamat Email</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope"></i>
                        <input type="email" placeholder="nama@email.com" required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Wilayah Domisili</label>
                    <div class="input-wrapper">
                        <i class="bi bi-geo-alt"></i>
                        <select required>
                            <option value="" disabled selected>Pilih Provinsi...</option>
                            <option>Bali</option>
                            <option>Jawa Timur</option>
                            <option>Jawa Tengah</option>
                            <option>Jawa Barat</option>
                            <option>DKI Jakarta</option>
                        </select>
                    </div>
                </div>

                <button class="btn-join">
                    Bergabung Sekarang <i class="bi bi-rocket-takeoff"></i>
                </button>
            </form>

            <footer>
                Sudah punya akun?<a href="#">Masuk di sini</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, earth, clouds, stars;

        function initCenteredDesign() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            camera.position.z = 2.3; 
            camera.position.x = 0; 
            camera.position.y = 0;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('earth-canvas').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x444444); 
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.3); 
            sunLight.position.set(5, 3, 5);
            scene.add(sunLight);

            const textureLoader = new THREE.TextureLoader();
            const earthMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_atmos_2048.jpg');
            const specularMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_specular_2048.jpg');
            const normalMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_normal_2048.jpg');
            const cloudMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_clouds_1024.png');

            const earthGeometry = new THREE.SphereGeometry(1.25, 64, 64);
            const earthMaterial = new THREE.MeshPhongMaterial({
                map: earthMap,
                specularMap: specularMap,
                normalMap: normalMap,
                shininess: 20
            });
            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            scene.add(earth);

            const cloudGeometry = new THREE.SphereGeometry(1.268, 64, 64);
            const cloudMaterial = new THREE.MeshPhongMaterial({
                map: cloudMap,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
            scene.add(clouds);

            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({color: 0xffffff, size: 0.015});
            const starsVertices = [];
            for(let i = 0; i < 4000; i++) {
                const x = (Math.random() - 0.5) * 20;
                const y = (Math.random() - 0.5) * 20;
                const z = - (Math.random() * 15); 
                starsVertices.push(x, y, z);
            }
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);

            animateLoop();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            
            earth.rotation.y += 0.0004; 
            clouds.rotation.y += 0.0006; 
            clouds.rotation.x += 0.00005;
            stars.rotation.y -= 0.00008;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.position.x = 0; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initCenteredDesign();
    </script>
</body>
</html>
